static def registerCleanPreviousDistTask(def tasks, Iterable<String> clientOutputDirs) {
  return tasks.register("cleanPreviousDist", Delete) {
      group = 'Criteo'
      description = 'Clean up generated client output folders'

      delete clientOutputDirs
      followSymlinks = true
  }
}

ext {
    registerCleanPreviousDistTask = this.&registerCleanPreviousDistTask
}

name: Test Java Generator

on:
  pull_request:
    paths:
      - 'generator/java/**'
      - 'api-specifications/**'
      - 'api-specifications-test-only/**'
      # Shared build logic may break generation of every language without touching generator/python/**.
      - 'buildSrc/**'
      - 'build.gradle'
      - 'settings.gradle'
      - 'gradle.properties'
      - 'gradle/**'
      - 'gradlew'
      - 'scripts/**'
      - '.github/workflows/_generate_and_test.yml'
  push:
    branches:
      - 'update-oas-**'
  workflow_dispatch:

jobs:
  build:
    uses: ./.github/workflows/_generate_and_test.yml
    with:
      language: java
    secrets: inherit

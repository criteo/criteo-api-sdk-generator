name: Generate PHP Sources

on:
  push:
    branches:
      - main
    paths:
      - 'api-specifications/**'
  workflow_dispatch:

jobs:
  build:
    uses: ./.github/workflows/_generate_and_test.yml
    with:
      language: php
      upload_generated_sources: true
    secrets: inherit

  push:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.9'

      - uses: webfactory/ssh-agent@v0.10.0
        with:
            ssh-private-key: |
              ${{ secrets.PHP_SDK_REPO_PRIVATE_KEY_MS }}
              ${{ secrets.PHP_SDK_REPO_PRIVATE_KEY_RM }}
              ${{ secrets.PHP_SDK_REPO_PRIVATE_KEY_CGRID }}

      # Publish the sources that the build job validated.
      - name: Download generated sources
        uses: actions/download-artifact@v8
        with:
          name: generated-sources-php
          path: ./generated-sources/php

      - name: Push SDKs
        run: python ./scripts/push_sdk.py --language php
        shell: bash

  # Notifications live in their own job: if the build job fails, `push` is skipped,
  # and notifications inside `push` would never fire.
  notify:
    needs: [build, push]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Send success notification
        if: needs.push.result == 'success'
        uses: slackapi/slack-github-action@v4.0.0
        with:
          webhook: ${{ secrets.SLACK_WEBHOOK }}
          webhook-type: incoming-webhook
          payload: |
            status: "${{ job.status }}"
            channel: "C02J0CWR789"
            username: "sdk-generation-bot"
            text: "PHP build succeeded. <https://github.com/criteo/criteo-api-sdk-generator/actions/runs/${{github.run_id}}|Link to build>."
            icon_emoji: ":green_check_mark:"

      - name: Send failure notification
        if: needs.build.result == 'failure' || needs.push.result == 'failure'
        uses: slackapi/slack-github-action@v4.0.0
        with:
          webhook: ${{ secrets.SLACK_WEBHOOK }}
          webhook-type: incoming-webhook
          payload: |
            status: "${{ job.status }}"
            channel: "C02J0CWR789"
            username: "sdk-generation-bot"
            text: "PHP build failed. <https://github.com/criteo/criteo-api-sdk-generator/actions/runs/${{github.run_id}}|Link to build>."
            icon_emoji: ":x:"

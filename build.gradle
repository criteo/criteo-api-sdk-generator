import groovy.io.FileType

buildscript {
    repositories {
        mavenLocal()
        mavenCentral()
    }
}

apply plugin: 'java-library'

def swaggerList = []
def dir = new File("$rootDir/api-specifications".toString());

if (dir.exists()) {
    dir.eachFileRecurse(FileType.FILES) { file ->
        if (file.getName().endsWith(".json"))
            swaggerList << file
    }
} else {
    throw new GradleException("Folder api-specifications doesnt exist")
}

if (swaggerList.isEmpty()) {
    throw new GradleException("No swaggers found in api-specifications folder")
}

// Test-only specs: generated, but never pushed to the public SDK repositories nor to Postman.
def swaggerListTestOnly = []
def dirTestOnly = new File("$rootDir/api-specifications-test-only".toString());

if (dirTestOnly.exists()) {
    dirTestOnly.eachFileRecurse(FileType.FILES) { file ->
        if (file.getName().endsWith(".json"))
            swaggerListTestOnly << file
    }
}

ext {
    artifactId = "criteo-client-generator"
    groupId = "com.criteo.api"
    version = '1.0.0'
    description = 'Criteo API Clients Generator'
    sourceCompatibility = '1.8'
    jar.enabled = false
    generatedClientsDirName = 'generated-sources'
    generatedClientsDirNameTestOnly = 'generated-sources-test-only' // never pushed
    swaggerSourceList = swaggerList
    swaggerSourceListTestOnly = swaggerListTestOnly
}

        \ attribution method."
      example:
        attributionMethod: unknown
        lookbackWindow: unknown
      nullable: true
      properties:
        attributionMethod:
          description: "Ad set attribution method.\r\nThis defines how certain events\
            \ (visits, clicks, sales...) are attributed to the ad set.\r\n       \
            \     \r\nPossible values:\r\n- unknown\r\n- criteoAttribution (default\
            \ attribution method)\r\n- lastClick\r\n- postClick\r\n- sftp\r\n- googleAnalytics\
            \ (requires Google Analytics integration)"
          enum:
          - unknown
          - criteoAttribution
          - lastClick
          - postClick
          - sftp
          - googleAnalytics
          nullable: true
          type: string
        lookbackWindow:
          description: "The lookback window. Optional, should be specified only for\
            \ attribution methods PostClick and LastClick."
          enum:
          - unknown
          - 30M
          - 24H
          - 7D
          - 30D
          nullable: true
          type: string
      type: object
    ReadAdSetBiddingV26Q1:
      description: Ad set bidding read configuration.
      example:
        bidAmount: 0.8008281904610115
        costController: COS
      nullable: true
      properties:
        bidAmount:
          description: "Decimal value target relating to the `adSetObjective` specified.\r\
            \nMay be `null` for objectives that do not require a target value.\r\n\
            At most 4 decimals are supported. Additional decimals are rounded."
          format: double
          nullable: true
          type: number
        costController:
          description: "Cost controller for the ad set.\r\n            \r\nPossible\
            \ values:\r\n- COS\r\n- maxCPC\r\n- CPI\r\n- CPM\r\n- CPO\r\n- CPSV\r\n\
            - CPV\r\n- dailyBudget\r\n- targetCPM"
          enum:
          - COS
          - maxCPC
          - CPI
          - CPM
          - CPO
          - CPSV
          - CPV
          - dailyBudget
          - targetCPM
          nullable: true
          type: string
      type: object
    ReadAdSetBudgetV26Q1:
      description: "Budget configuration for an ad set. Controls how much can be spent\
        \ and how spending is paced.\r\nWhen budgetStrategy is \"capped\": budgetAmount,\
        \ budgetRenewal, and budgetDeliverySmoothing are all set.\r\nWhen budgetStrategy\
        \ is \"uncapped\": budgetAmount is null, budgetRenewal is \"undefined\", budgetDeliverySmoothing\
        \ is null, budgetDeliveryWeek is \"undefined\", and pacingBehavior is \"undefined\"\
        ."
      example:
        budgetDeliverySmoothing: accelerated
        budgetDeliveryWeek: undefined
        budgetAmount: 6.027456183070403
        budgetRenewal: undefined
        pacingBehavior: undefined
        budgetStrategy: capped
      nullable: true
      properties:
        budgetAmount:
          description: Maximum budget amount in the advertiser's currency per renewal
            period. Required non-null when capped. Must be null when uncapped.
          format: double
          nullable: true
          type: number
        budgetDeliverySmoothing:
          description: "Pacing strategy for spending the budget within a renewal period.\
            \ Only applicable when budgetStrategy is \"capped\".\r\n- \"accelerated\"\
            : spend pacing is based on delivery efficiency rather than the full budget\
            \ period.\r\n- \"standard\": spread spending evenly over the renewal period.\r\
            \nWhen budgetStrategy is \"uncapped\", this field is not set (null in\
            \ read responses, omit in create/patch requests)."
          enum:
          - accelerated
          - standard
          nullable: true
          type: string
        budgetDeliveryWeek:
          description: "Defines which day-of-week boundaries are used for weekly budget\
            \ renewal. Only applicable when budgetStrategy is \"capped\", budgetRenewal\
            \ is \"weekly\", and budgetDeliverySmoothing is \"standard\".\r\n- \"\
            mondayToSunday\", \"tuesdayToMonday\", etc.: the day range over which\
            \ the weekly budget is paced. Changing this value on the active budget\
            \ also propagates to all scheduled budgets of the same ad set.\r\n- \"\
            undefined\": used when budgetStrategy is \"uncapped\", when budgetRenewal\
            \ is not \"weekly\", or when budgetDeliverySmoothing is \"accelerated\"\
            ."
          enum:
          - undefined
          - mondayToSunday
          - tuesdayToMonday
          - wednesdayToTuesday
          - thursdayToWednesday
          - fridayToThursday
          - saturdayToFriday
          - sundayToSaturday
          nullable: true
          type: string
        budgetRenewal:
          description: "The period over which the budget is spent.\r\n- \"daily\"\
            , \"monthly\", \"weekly\": budget resets at the start of each period.\r\
            \n- \"lifetime\": budget covers the entire ad set duration without resetting.\r\
            \n- \"undefined\": only used when budgetStrategy is \"uncapped\" (no renewal\
            \ applies). Required for capped budgets (must not be \"undefined\")."
          enum:
          - undefined
          - daily
          - monthly
          - lifetime
          - weekly
          nullable: true
          type: string
        budgetStrategy:
          description: "Controls whether the ad set has a spending limit.\r\n- \"\
            capped\": spending is limited to budgetAmount. Requires budgetAmount (non-null),\
            \ budgetRenewal (not \"undefined\"), and budgetDeliverySmoothing (not\
            \ null).\r\n- \"uncapped\": no spending limit. budgetAmount is null, budgetRenewal\
            \ is \"undefined\", and budgetDeliverySmoothing is null."
          enum:
          - capped
          - uncapped
          nullable: true
          type: string
        pacingBehavior:
          description: "Controls how a standard capped budget is paced.\r\n- \"targetFullBudget\"\
            : spend toward the full budget amount within the renewal period.\r\n-\
            \ \"targetAverageDailyBudget\": spend toward an average daily amount.\
            \ Only supported for capped, standard, monthly budgets.\r\n- \"undefined\"\
            : no explicit pacing behavior. Required for uncapped budgets and accelerated\
            \ budgets."
          enum:
          - undefined
          - targetFullBudget
          - targetAverageDailyBudget
          nullable: true
          type: string
      type: object
    ReadAdSetScheduleV26Q1:

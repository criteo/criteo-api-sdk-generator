openapi: 3.0.1
info:
  description: Criteo API - MarketingSolutions
  title: Criteo API
  version: Experimental
servers:
- url: https://api.criteo.com
security:
- oauth: []
tags:
- name: Advertiser
- name: Analytics
- name: Audience
- name: Campaign
- name: Catalog
- name: Creative
- name: Gateway
- name: OnSiteRecommendation
- name: Reco
paths:
  /experimental/ads/{ad-id}/product-filter:
    delete:
      description: Disable product filtering for a given ad
      operationId: DisableProductFiltering
      parameters:
      - description: ID of the ad
        explode: false
        in: path
        name: ad-id
        required: true
        schema:
          type: string
        style: simple
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValueResourceOutcomeOfProductFilterConfig'
          description: Successful operation
      security:
      - oauth:
        - MarketingSolutions_Reco_Manage
      summary: "/experimental/ads/{ad-id}/product-filter"
      tags:
      - Reco
      x-accepts: application/json
    get:
      description: Fetch product filtering configuration for a given ad
      operationId: FetchProductFilteringConfig
      parameters:
      - description: ID of the ad
        explode: false
        in: path
        name: ad-id
        required: true
        schema:
          type: string
        style: simple
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValueResourceOutcomeOfProductFilterConfig'
          description: "Successful operation. Returns the product filtering configuration\
            \ if it exists, or empty data if it doesn't."
      security:
      - oauth:
        - MarketingSolutions_Reco_Read
      summary: "/experimental/ads/{ad-id}/product-filter"
      tags:
      - Reco
      x-accepts: application/json
    post:
      description: Enable product filtering for a given ad
      operationId: EnableProductFiltering
      parameters:
      - description: ID of the ad
        explode: false
        in: path
        name: ad-id
        required: true
        schema:
          type: string
        style: simple
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ValueResourceInputOfCreateProductFilterRequest'
        x-bodyName: createProductFilterRequest
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValueResourceOutcomeOfProductFilterConfig'
          description: successful operation
      security:
      - oauth:
        - MarketingSolutions_Reco_Manage
      summary: "/experimental/ads/{ad-id}/product-filter"
      tags:
      - Reco
      x-content-type: application/json
      x-accepts: application/json
  /experimental/ads/{id}:
    delete:
      description: Delete an Ad
      operationId: DeleteAd
      parameters:
      - description: The ad identifier to delete.
        explode: false
        in: path
        name: id
        required: true
        schema:
          format: int32
          type: string
        style: simple
      responses:
        "204":
          description: The ad was deleted.
      security:
      - oauth:
        - MarketingSolutions_Creative_Manage
      summary: "/experimental/ads/{id}"
      tags:
      - Creative
      x-accepts: application/json
    get:
      description: Get an Ad with its id
      operationId: GetAd
      parameters:
      - description: The ad identifier to retrieve.
        explode: false
        in: path
        name: id
        required: true
        schema:
          format: int32
          type: string
        style: simple
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResourceOutcomeOfAd'
          description: The found ad is returned.
      security:
      - oauth:
        - MarketingSolutions_Creative_Read
      summary: "/experimental/ads/{id}"
      tags:
      - Creative
      x-accepts: application/json
  /experimental/advertisers/{advertiser-id}/ads:
    get:
      description: Get the list of self-services Ads for a given advertiser
      operationId: GetAdvertiserAds
      parameters:
      - description: The advertiser identifier.
        explode: false
        in: path
        name: advertiser-id
        required: true
        schema:
          type: string
        style: simple
      - description: The number of ads to be returned. The default is 50.
        explode: true
        in: query
        name: limit
        required: false
        schema:
          format: int32
          nullable: true
          type: integer
        style: form
      - description: The (zero-based) offset into the collection of ads. The default
          is 0.
        explode: true
        in: query
        name: offset
        required: false
        schema:
          format: int32
          nullable: true
          type: integer
        style: form
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResourceCollectionOutcomeOfAd'
          description: The list of self-services Ads is returned.
      security:
      - oauth:
        - MarketingSolutions_Creative_Read
      summary: "/experimental/advertisers/{advertiser-id}/ads"
      tags:
      - Creative
      x-accepts: application/json
    post:
      description: Create an Ad
      operationId: CreateAdvertiserAd
      parameters:
      - description: The advertiser identifier.
        explode: false
        in: path
        name: advertiser-id
        required: true
        schema:
          type: string
        style: simple
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResourceInputOfAdWrite'
        required: true
        x-bodyName: request
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResourceOutcomeOfAd'
          description: The created Ad is returned.
      security:
      - oauth:
        - MarketingSolutions_Creative_Manage
      summary: "/experimental/advertisers/{advertiser-id}/ads"
      tags:
      - Creative
      x-content-type: application/json
      x-accepts: application/json
  /experimental/advertisers/{advertiser-id}/coupons:
    get:
      description: Get the list of self-services Coupons for a given advertiser
      operationId: GetAdvertiserCoupons
      parameters:
      - description: The advertiser identifier.
        explode: false
        in: path
        name: advertiser-id
        required: true
        schema:
          type: string
        style: simple
      - description: The number of coupons to be returned. The default is 50.
        explode: true
        in: query
        name: limit
        required: false
        schema:
          format: int32
          nullable: true
          type: integer
        style: form
      - description: The (zero-based) offset into the collection of coupons. The default
          is 0.
        explode: true
        in: query
        name: offset
        required: false
        schema:
          format: int32
          nullable: true
          type: integer
        style: form
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResourceCollectionOutcomeOfCoupon'
          description: The list of self-services Coupons is returned.
      security:
      - oauth:
        - MarketingSolutions_Creative_Read
      summary: "/experimental/advertisers/{advertiser-id}/coupons"
      tags:
      - Creative
      x-accepts: application/json
    post:
      description: Create a Coupon
      operationId: CreateAdvertiserCoupon
      parameters:
      - description: The advertiser identifier.
        explode: false
        in: path
        name: advertiser-id
        required: true
        schema:
          type: string
        style: simple
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResourceInputOfCreateCoupon'
        required: true
        x-bodyName: request
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResourceOutcomeOfCoupon'
          description: The created Coupon is returned.
      security:
      - oauth:
        - MarketingSolutions_Creative_Manage
      summary: "/experimental/advertisers/{advertiser-id}/coupons"
      tags:
      - Creative
      x-content-type: application/json
      x-accepts: application/json
  /experimental/advertisers/{advertiser-id}/coupons-supported-sizes:
    get:
      description: Get the list of Coupon supported sizes
      operationId: GetAdvertiserCouponSupportedSizes
      parameters:
      - description: The ad set id on which you want to check the Coupon supported
          sizes.
        explode: true
        in: query
        name: ad-set-id
        required: false
        schema:
          type: string
        style: form
      - description: The advertiser identifier.
        explode: false
        in: path
        name: advertiser-id
        required: true
        schema:
          type: string
        style: simple
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResourceOutcomeOfCouponSupportedSizes'
          description: The list of Coupon supported sizes is returned.
      security:
      - oauth:
        - MarketingSolutions_Creative_Read
      summary: "/experimental/advertisers/{advertiser-id}/coupons-supported-sizes"
      tags:
      - Creative
      x-accepts: application/json
  /experimental/advertisers/{advertiser-id}/coupons/{id}:
    delete:
      description: Delete a Coupon
      operationId: DeleteAdvertiserCoupon
      parameters:
      - description: The advertiser identifier.
        explode: false
        in: path
        name: advertiser-id
        required: true
        schema:
          type: string
        style: simple
      - description: The Coupon identifier to delete.
        explode: false
        in: path
        name: id
        required: true
        schema:
          type: string
        style: simple
      responses:
        "204":
          description: The Coupon was deleted.
      security:
      - oauth:
        - MarketingSolutions_Creative_Manage
      summary: "/experimental/advertisers/{advertiser-id}/coupons/{id}"
      tags:
      - Creative
      x-accepts: application/json
    get:
      description: Get a Coupon with its id
      operationId: GetAdvertiserCoupon
      parameters:
      - description: The advertiser identifier.
        explode: false
        in: path
        name: advertiser-id
        required: true
        schema:
          type: string
        style: simple
      - description: The Coupon identifier to retrieve.
        explode: false
        in: path
        name: id
        required: true
        schema:
          type: string
        style: simple
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResourceOutcomeOfCoupon'
          description: The found Coupon is returned.
      security:
      - oauth:
        - MarketingSolutions_Creative_Read
      summary: "/experimental/advertisers/{advertiser-id}/coupons/{id}"
      tags:
      - Creative
      x-accepts: application/json
    put:
      description: Edit a specific Coupon
      operationId: EditAdvertiserCoupon
      parameters:
      - description: The advertiser identifier.
        explode: false
        in: path
        name: advertiser-id
        required: true
        schema:
          type: string
        style: simple
      - description: The Coupon identifier to edit.
        explode: false
        in: path
        name: id
        required: true
        schema:
          type: string
        style: simple
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResourceInputOfUpdateCoupon'
        required: true
        x-bodyName: request
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResourceOutcomeOfCoupon'
          description: The edited Coupon is returned.
      security:
      - oauth:
        - MarketingSolutions_Creative_Manage
      summary: "/experimental/advertisers/{advertiser-id}/coupons/{id}"
      tags:
      - Creative
      x-content-type: application/json
      x-accepts: application/json
  /experimental/advertisers/{advertiser-id}/coupons/{id}/preview:
    get:
      description: Get the preview of a specific Coupon
      operationId: GetAdvertiserCouponPreview
      parameters:
      - description: The advertiser identifier.
        explode: false
        in: path
        name: advertiser-id
        required: true
        schema:
          type: string
        style: simple
      - description: The height of the coupon to preview.
        explode: true
        in: query
        name: height
        required: false
        schema:
          format: int32
          type: integer
        style: form
      - description: The Coupon identifier to preview.
        explode: false
        in: path
        name: id
        required: true
        schema:
          type: string
        style: simple
      - description: The width of the coupon to preview.
        explode: true
        in: query
        name: width
        required: false
        schema:
          format: int32
          type: integer
        style: form
      responses:
        "200":
          content:
            text/html:
              schema:
                type: string
            application/json:
              schema:
                type: string
          description: The preview HTML of a specific Coupon is returned.
      security:
      - oauth:
        - MarketingSolutions_Creative_Read
      summary: "/experimental/advertisers/{advertiser-id}/coupons/{id}/preview"
      tags:
      - Creative
      x-accepts: application/json
  /experimental/advertisers/{advertiser-id}/creatives:
    get:
      description: Get the list of self-services Creatives for a given advertiser
      operationId: GetAdvertiserCreatives
      parameters:
      - description: The advertiser identifier.
        explode: false
        in: path
        name: advertiser-id
        required: true
        schema:
          type: string
        style: simple
      - description: The number of creatives to be returned. The default is 50.
        explode: true
        in: query
        name: limit
        required: false
        schema:
          format: int32
          nullable: true
          type: integer
        style: form
      - description: The (zero-based) offset into the collection of creatives. The
          default is 0.
        explode: true
        in: query
        name: offset
        required: false
        schema:
          format: int32
          nullable: true
          type: integer
        style: form
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResourceCollectionOutcomeOfCreativeRead'
          description: The list of self-services Creatives is returned.This list will
            contain creatives in draft status as well which will have some properties
            as null
      security:
      - oauth:
        - MarketingSolutions_Creative_Read
      summary: "/experimental/advertisers/{advertiser-id}/creatives"
      tags:
      - Creative
      x-accepts: application/json
    post:
      description: Create a Creative
      operationId: CreateAdvertiserCreative
      parameters:
      - description: The advertiser identifier.
        explode: false
        in: path
        name: advertiser-id
        required: true
        schema:
          type: string
        style: simple
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResourceInputOfCreativeWrite'
        required: true
        x-bodyName: request
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResourceOutcomeOfCreative'
          description: The created creative is returned.
      security:
      - oauth:
        - MarketingSolutions_Creative_Manage
      summary: "/experimental/advertisers/{advertiser-id}/creatives"
      tags:
      - Creative
      x-content-type: application/json
      x-accepts: application/json
  /experimental/advertisers/{advertiser-id}/datasets:
    get:
      description: Retrieves corresponding Datasets for a given Advertiser. Only those
        Datasets are included for which the given Advertiser is marked a primary.
      operationId: ListDatasetsByAdvertiser
      parameters:
      - description: The id of the Advertiser for which Datasets are being retrieved.
        explode: false
        in: path
        name: advertiser-id
        required: true
        schema:
          type: string
        style: simple
      responses:
        "200":
          content:
            application/json:
              example:
                data:
                - type: dataset
                  id: "73550"
                  attributes:
                    name: Dataset 1
                errors: []
                warnings: []
              schema:
                $ref: '#/components/schemas/AdvertiserDatasetListResponse'
          description: Success
      security:
      - oauth: []
      summary: "/experimental/advertisers/{advertiser-id}/datasets"
      tags:
      - Advertiser
      x-accepts: application/json
  /experimental/advertisers/{advertiserId}/targeting/bundle-rules:
    delete:
      description: "Removes some bundles from the current list of targeted bundles\
        \ for a given advertiser.<br />\r\nThe mode of targeting (allowlist/blocklist)\
        \ cannot be updated through this method."
      operationId: DeleteAdvertiserBundleRules
      parameters:
      - description: The advertiser id
        explode: false
        in: path
        name: advertiserId
        required: true
        schema:
          format: int32
          type: string
        style: simple
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApiRequestOfTargetingEntity'
        description: Contains the list of items to delete from the list
        x-bodyName: apiRequest
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseOfTargetingEntity'
          description: Success
      security:
      - oauth:
        - MarketingSolutions_Campaign_Manage
      summary: "/experimental/advertisers/{advertiserId}/targeting/bundle-rules"
      tags:
      - Campaign
      x-content-type: application/json
      x-accepts: application/json
    get:
      description: Returns a list of all targeted bundles for an advertiser.
      operationId: GetAdvertiserBundleRules
      parameters:
      - description: The advertiser id
        explode: false
        in: path
        name: advertiserId
        required: true
        schema:
          format: int32
          type: string
        style: simple
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseOfTargetingEntity'
          description: Success
      security:
      - oauth:
        - MarketingSolutions_Campaign_Read
      summary: "/experimental/advertisers/{advertiserId}/targeting/bundle-rules"
      tags:
      - Campaign
      x-accepts: application/json
    post:
      description: "Inserts a list of targeted bundles for an advertiser and sets\
        \ the targeting mode : blocklisting or allowlisting.<br />\r\nIt will replace\
        \ the current list if any."
      operationId: PostAdvertiserBundleRules
      parameters:
      - description: The advertiser id
        explode: false
        in: path
        name: advertiserId
        required: true
        schema:
          format: int32
          type: string
        style: simple
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApiRequestOfTargetingEntity'
        description: Description of the targeting rule to setup
        required: true
        x-bodyName: apiRequest
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseOfTargetingEntity'
          description: Success
      security:
      - oauth:
        - MarketingSolutions_Campaign_Manage
      summary: "/experimental/advertisers/{advertiserId}/targeting/bundle-rules"
      tags:
      - Campaign
      x-content-type: application/json
      x-accepts: application/json
    put:
      description: "Updates the targeted bundles for an advertiser by adding a list\
        \ of bundles to the current list.<br />\r\nThe mode of targeting (allowlist/blocklist)\
        \ cannot be updated through this method."
      operationId: PutAdvertiserBundleRules
      parameters:
      - description: The advertiser id
        explode: false
        in: path
        name: advertiserId
        required: true
        schema:
          format: int32
          type: string
        style: simple
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApiRequestOfTargetingEntity'
        description: Contains the list of items to add to the existing list
        required: true
        x-bodyName: apiRequest
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseOfTargetingEntity'
          description: Success
      security:
      - oauth:
        - MarketingSolutions_Campaign_Manage
      summary: "/experimental/advertisers/{advertiserId}/targeting/bundle-rules"
      tags:
      - Campaign
      x-content-type: application/json
      x-accepts: application/json
  /experimental/advertisers/{advertiserId}/targeting/domain-rules:
    delete:
      description: "Removes some domains from the current list of targeted domains\
        \ for a given advertiser.<br />\r\nThe mode of targeting (allowlist/blocklist)\
        \ cannot be updated through this method."
      operationId: DeleteAdvertiserDomainRules
      parameters:
      - description: The advertiser id
        explode: false
        in: path
        name: advertiserId
        required: true
        schema:
          format: int32
          type: string
        style: simple
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApiRequestOfTargetingEntity'
        description: Contains the list of items to delete from the list
        x-bodyName: apiRequest
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseOfTargetingEntity'
          description: Success
      security:
      - oauth:
        - MarketingSolutions_Campaign_Manage
      summary: "/experimental/advertisers/{advertiserId}/targeting/domain-rules"
      tags:
      - Campaign
      x-content-type: application/json
      x-accepts: application/json
    get:
      description: Returns a list of all targeted domains for an advertiser.
      operationId: GetAdvertiserDomainRules
      parameters:
      - description: The advertiser id
        explode: false
        in: path
        name: advertiserId
        required: true
        schema:
          format: int32
          type: string
        style: simple
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseOfTargetingEntity'
          description: Success
      security:
      - oauth:
        - MarketingSolutions_Campaign_Read
      summary: "/experimental/advertisers/{advertiserId}/targeting/domain-rules"
      tags:
      - Campaign
      x-accepts: application/json
    post:
      description: "Inserts a list of targeted domains for an advertiser and sets\
        \ the targeting mode : blocklisting or allowlisting.<br />\r\nIt will replace\
        \ the current list if any."
      operationId: PostAdvertiserDomainRules
      parameters:
      - description: The advertiser id
        explode: false
        in: path
        name: advertiserId
        required: true
        schema:
          format: int32
          type: string
        style: simple
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApiRequestOfTargetingEntity'
        description: Description of the targeting rule to setup
        required: true
        x-bodyName: apiRequest
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseOfTargetingEntity'
          description: Success
      security:
      - oauth:
        - MarketingSolutions_Campaign_Manage
      summary: "/experimental/advertisers/{advertiserId}/targeting/domain-rules"
      tags:
      - Campaign
      x-content-type: application/json
      x-accepts: application/json
    put:
      description: "Updates the targeted domains for an advertiser by adding a list\
        \ of domains to the current list.<br />\r\nThe mode of targeting (allowlist/blocklist)\
        \ cannot be updated through this method."
      operationId: PutAdvertiserDomainRules
      parameters:
      - description: The advertiser id
        explode: false
        in: path
        name: advertiserId
        required: true
        schema:
          format: int32
          type: string
        style: simple
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApiRequestOfTargetingEntity'
        description: Contains the list of items to add to the existing list
        required: true
        x-bodyName: apiRequest
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseOfTargetingEntity'
          description: Success
      security:
      - oauth:
        - MarketingSolutions_Campaign_Manage
      summary: "/experimental/advertisers/{advertiserId}/targeting/domain-rules"
      tags:
      - Campaign
      x-content-type: application/json
      x-accepts: application/json
  /experimental/advertisers/me:
    get:
      description: Fetch the portfolio of Advertisers for this account
      operationId: ListAdvertisers
      responses:
        "200":
          content:
            application/json:
              example:
                data:
                - type: advertiser
                  id: "13"
                  attributes:
                    advertiserName: ClientName1
                - type: advertiser
                  id: "1352"
                  attributes:
                    advertiserName: ClientName2
                - type: advertiser
                  id: "73550"
                  attributes:
                    advertiserName: ClientName3
                errors: []
                warnings: []
              schema:
                $ref: '#/components/schemas/GetPortfolioResponse'
          description: Success
      security:
      - oauth: []
      summary: /experimental/advertisers/me
      tags:
      - Advertiser
      x-accepts: application/json

    BudgetAutomation:
      description: "Budget automation, lets users configure budgets once at the campaign\
        \ level while Criteo dynamically routes spend toward the best-performing ad\
        \ sets.\r\nIf \"enabled\" is omitted and only \"budgetConfiguration\" is provided,\
        \ \"enabled\" defaults to false — budget automation will not be activated.\r\
        \nTo activate budget automation at creation, \"enabled\" must be explicitly\
        \ set to true along with a valid \"budgetConfiguration\".\r\nIf the entire\
        \ \"budgetAutomation\" object is omitted from the create request, the campaign\
        \ is created with budget automation disabled."
      example:
        budgetConfiguration:
          adSetObjectives: conversions
        enabled: true
      properties:
        budgetConfiguration:
          $ref: '#/components/schemas/BudgetAutomationConfiguration'
        enabled:
          description: "Whether budget automation is active for this marketing campaign.\r\
            \n- true: budget automation is enabled and \"budgetConfiguration\" must\
            \ be provided with a valid objective.\r\n- false (default when omitted):\
            \ budget automation is disabled; \"budgetConfiguration\" is ignored if\
            \ provided."
          type: boolean
      type: object
    BudgetAutomationConfiguration:
      description: "Configuration for budget automation. Only meaningful when \"enabled\"\
        \ is true.\r\nWhen \"enabled\" is false or omitted, this field is ignored."
      example:
        adSetObjectives: conversions
      nullable: true
      properties:
        adSetObjectives:
          description: "The ad set optimization objective for budget automation. Determines\
            \ how the automated budget allocates spend across ad sets in the campaign.\r\
            \n- \"conversions\": optimize for conversion events.\r\n- \"revenue\"\
            : optimize for revenue.\r\n- \"visits\": optimize for site visits.\r\n\
            - \"videoViews\": optimize for completed video views."
          enum:
          - conversions
          - revenue
          - visits
          - videoViews
          type: string
      type: object
    CampaignBudgetAutomationV23Q1:
      description: "Budget automation, also known as automated budget or budget pacing,\
        \ lets users configure KPIs and budgets once at the campaign level while Criteo\
        \ dynamically routes spend toward the best-performing ad sets.\r\nWhen enabled\
        \ is false, automatedBudgetConfiguration is null.\r\nWhen enabled is true,\
        \ automatedBudgetConfiguration.adSetOptimizationObjective is expected."
      example:
        automatedBudgetConfiguration:
          adSetOptimizationObjective: conversions
        enabled: true
      nullable: true
      properties:
        automatedBudgetConfiguration:
          $ref: '#/components/schemas/AutomatedBudgetConfigurationV23Q1'
        enabled:
          description: Whether budget automation is enabled for this campaign. This
            field is always present in the response.
          nullable: true
          type: boolean
      type: object
    CampaignSearchFiltersV23Q1:
      description: "Filters for searching campaigns.\r\n            \r\nMultiple filters\
        \ are combined with an implicit AND operation.\r\nIdentifiers are string-encoded\
        \ integers; invalid values are ignored.\r\nIf no filter is provided (both\
        \ arrays are null or empty), the search returns all accessible campaigns."
      example:
        advertiserIds:
        - advertiserIds
        - advertiserIds
        campaignIds:
        - campaignIds
        - campaignIds
      properties:
        advertiserIds:
          description: Advertiser IDs to filter on (string-encoded integers).

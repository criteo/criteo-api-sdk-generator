          description: "Goal of the campaign\r\n            \r\nSerialized values\
            \ are {unspecified}, {acquisition} and {retention}.\r\n            \r\n\
            Acquisition and retention are defined as follows:\r\n- Acquisition: campaign\
            \ with the goal of acquiring new customers. The success of an acquisition\
            \ campaign is measured by the number of new customers it brings.\r\n-\
            \ Retention: campaign with the goal of retaining existing customers. The\
            \ success of a retention campaign is measured by the number of existing\
            \ customers it retains."
          enum:

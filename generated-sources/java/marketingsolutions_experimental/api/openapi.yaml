      type: object
    CampaignSpendLimitV23Q1:
      description: Campaign spend-limit configuration. A capped spend limit restricts
        campaign spending per renewal period. An uncapped spend limit does not impose
        a spending ceiling.
      example:
        spendLimitRenewal: undefined
        spendLimitAmount:
          value: 0.8008281904610115
        spendLimitType: capped
      nullable: true
      properties:
        spendLimitAmount:
          $ref: '#/components/schemas/NillableDecimal'
        spendLimitRenewal:
          description: "The period over which the campaign spend limit is applied.\r\
            \nWhen spendLimitType is \"capped\", this is \"daily\", \"monthly\", or\
            \ \"lifetime\".\r\nWhen spendLimitType is \"uncapped\", this is \"undefined\"\
            ."
          enum:
          - undefined
          - daily
          - monthly
          - lifetime
          nullable: true
          type: string
        spendLimitType:
          description: "Controls whether the campaign has a spend limit.\r\n\"capped\"\
            \ returns a non-null spendLimitAmount.value and a spendLimitRenewal of\
            \ \"daily\", \"monthly\", or \"lifetime\".\r\n\"uncapped\" returns spendLimitAmount.value\
            \ as null and spendLimitRenewal as \"undefined\"."
          enum:
          - capped
          - uncapped
          nullable: true
          type: string
      type: object
    CampaignV23Q1:
      description: "Campaign read model\r\n            \r\nThe {id} field is the campaign\
        \ identifier (string-encoded integer)."
      example:

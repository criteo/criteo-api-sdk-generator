    CreateAdSetBiddingV26Q1:
      description: ad set bidding create model
      properties:
        bidAmount:
          description: Decimal value target relating to the `bidStrategy` specified.
            May be `null` for strategies that do not require a target value. At most
            4 decimals are supported. Additional decimals are rounded.
          format: double
          nullable: true
          type: number
        costController:
          description: How spend is controlled
          enum:
          - COS
          - maxCPC
          - CPI
          - CPM
          - CPO
          - CPSV
          - CPV
          - dailyBudget
          - targetCPM
          type: string
      required:

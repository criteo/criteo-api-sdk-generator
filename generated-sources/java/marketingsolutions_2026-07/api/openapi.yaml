        name: name
        budgetAutomation:
          automatedBudgetConfiguration:
            adSetOptimizationObjective: conversions
          enabled: true
        spendLimit:
          spendLimitRenewal: undefined
          spendLimitAmount:
            value: 0.8008281904610115
          spendLimitType: capped
        id: id
        advertiserId: advertiserId

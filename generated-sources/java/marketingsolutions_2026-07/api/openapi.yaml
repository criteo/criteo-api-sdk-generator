        \n            \r\nFiltering the results to events associated with a specific\
        \ campaign is done by setting\r\nthe `campaignId` filter parameter to the\
        \ desired value.\r\n            \r\nFiltering the results to events associated\
        \ with a specific seller is done by setting\r\nthe `sellerId` filter parameter\
        \ to the desired value.\r\n            \r\nFiltering the results to events\r\
        \nthat happened in a time interval is done by setting the `startDate` and\r\
        \n`endDate` filter parameters using the `yyyy-MM-DD` format. The start date\r\
        \nincludes all events timestamped since the beginning of that day while the\
        \ end\r\ndate includes events until the end of day. The maximum duration of\
        \ the date\r\nrange is 1 year. If the aggregation interval is `hour`, then\
        \ the maximum\r\nduration of the date range is 31 days. Note that month and\
        \ year aggregate values\r\nmay contain partial data for the interval if filtering\
        \ by date.\r\n            \r\nFiltering the results to a maximum number of\
        \ data rows is done by setting the\r\n`count` filter parameter. When combined\
        \ with startDate this can be used to perform\r\nsimple pagination.\r\n   \
        \         \r\n## Response Format\r\n            \r\nThe representation format\

    BehavioralV1:
      description: Settings of a behavioral set of users provided by Criteo.
      example:
        country: country
        endDate: 2000-01-23T04:56:07.000+00:00
        category: Unknown
        startDate: 2000-01-23T04:56:07.000+00:00

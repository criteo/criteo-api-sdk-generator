        \ 12502, 48, 3.36, 0, 0.0, 0.0, null, null, 0.0],\r\n        [168423, 1110225,\
        \ \"117980027\", \"2019-06-01\", 20266, 53, 3.71, 0, 0.0, 0.0, null, null,\
        \ 0.0]\r\n    ],\r\n    \"rows\": 4\r\n}\r\n```\r\n            \r\nThe JSON\
        \ result is an object with three fields (`columns`, `data`, and `rows`). The\r\
        \n“columns” array acts as the header for the data rows. The categorical dimension\r\
        \ncolumns come first and include the campaign id, seller id, and seller name.\r\
        \nThe interval column comes next and defines the aggregation period. The interval\

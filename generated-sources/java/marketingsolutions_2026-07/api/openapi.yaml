        \ `month`, or `year` aligned with the user timezone if\r\nprovided. The aggregation\
        \ interval size is controlled by `intervalSize`. The remaining columns\r\n\
        are metrics.\r\n            \r\n## Metrics\r\n            \r\nThe metrics\
        \ reported by this endpoint are\r\n            \r\n.  | Metric Group | Description\r\

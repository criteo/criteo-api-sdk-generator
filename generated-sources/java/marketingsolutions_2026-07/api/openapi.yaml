    SellerBase:
      description: The seller represents the merchant selling products on the advertiser's
        marketplace platform.
      example:
        id: "10656107"
        sellerName: AutoShop NYC
      properties:
        id:
          description: Unique seller identifier
          type: string
        sellerName:
          description: Display name of the seller (merchant)
          type: string
      type: object
    SellerBudgetMessage:
      description: A budget defines spending constraints for a seller across one or
        more campaigns. Each seller can have one active budget per time period.
      example:
        id: "16501666"
        sellerId: "10656107"
        campaignIds:
        - 436017
        budgetType: Capped
        amount: 462.47
        endDate: 2026-04-30
        spend: 117.59
        status: Current
        isSuspended: false
      properties:
        amount:
          description: Budget amount in the advertiser's currency
          format: double
          nullable: true
          type: number
        budgetType:
          description: "Type of budget: 'Daily' (daily cap), 'Capped' (lifetime with\
            \ fixed amount), or 'Uncapped' (lifetime with no limit)"
          type: string
        campaignIds:
          description: List of campaign IDs this budget applies to
          items:
            format: int32
            type: integer
          type: array
        endDate:
          description: "End date of the budget period (format: YYYY-MM-DD), or empty\
            \ string if open-ended"
          type: string
        id:
          description: Unique budget identifier
          type: string
        isSuspended:
          description: Whether the budget has been manually suspended by the partner
          type: boolean
        sellerId:
          description: Identifier of the seller this budget belongs to
          type: string
        spend:
          description: "Amount spent against this budget so far, or null if not available"
          format: double
          nullable: true
          type: number
        startDate:
          description: "Start date of the budget period (format: YYYY-MM-DD)"
          format: date
          type: string
        status:
          $ref: '#/components/schemas/SellerBudgetStatusV2'
      type: object
    SellerBudgetStatusV2:
      description: Status of a seller budget
      enum:
      - Archived
      - Current
      - Scheduled
      type: string
    SellerCampaignMessage:
      description: "A seller-campaign links a seller to a campaign, defining the CPC\
        \ bid. A seller can participate in multiple campaigns, and a campaign can\
        \ have multiple sellers."
      example:
        id: "10656107.248287"
        sellerId: "10656107"
        campaignId: 248287
        bid: 0.15
        suspendedSince: 2021-03-03T15:14:25.7970000+00:00
        suspensionReasons:
        - NoBudgetDefined
      properties:
        bid:
          description: Cost-per-click bid in the advertiser's currency. Null means
            no CPC is defined (seller-campaign will be suspended with NoCpcDefined).
            Set to 0 to stop delivery.
          format: double
          nullable: true
          type: number
        campaignId:
          description: Identifier of the campaign this seller participates in
          format: int32
          type: integer
        id:
          description: "Composite identifier in format {sellerId}.{campaignId}"
          readOnly: true
          type: string
        productSet:
          $ref: '#/components/schemas/SellerCampaignProductSet'
        sellerId:
          description: Unique identifier of the seller (merchant)
          type: string
        suspendedSince:
          description: Timestamp when the seller-campaign was suspended. Null means
            the seller-campaign is active.
          format: date-time
          nullable: true
          type: string
        suspensionReasons:
          description: List of reasons why the seller-campaign is suspended. Null
            means the seller-campaign is active.
          items:
            $ref: '#/components/schemas/SellerCampaignSuspensionReason'
          nullable: true
          type: array
      type: object
      x-readonly-id: true
    SellerCampaignProductSet:
      description: Product set targeting configuration for a seller-campaign
      nullable: true
      properties:
        productSetNumberOfProducts:
          description: Number of products matching the product set rules
          format: int32
          nullable: true
          type: integer
        productSetStatus:
          description: "Status of the product set (e.g. Active, Pending)"
          nullable: true
          type: string
        rules:
          description: Array of product set filtering rules
          items:
            type: object
          nullable: true
          type: array
      type: object
    SellerCampaignSuspensionReason:
      description: "Reason why a seller-campaign is suspended. Values: ManuallyStopped\
        \ (manually paused by the partner), NoBudgetDefined (no valid budget linked),\
        \ NoCpcDefined (no CPC bid set), NoMoreBudget (lifetime budget fully spent),\
        \ NoMoreDailyBudget (daily budget limit reached), RemovedFromCatalog (all\
        \ products removed from catalog), NotYetStarted (newly created, not yet processed),\
        \ Other (internal issue preventing delivery)."
      enum:
      - NoMoreBudget
      - ManuallyStopped
      - NoBudgetDefined
      - NoCpcDefined
      - RemovedFromCatalog
      - NotYetStarted
      - NoMoreDailyBudget
      - Other
      type: string
    SellerCampaignUpdate:
      description: Data used to update a Seller-Campaign's Bid.
      example:
        id: id
        bid: 0.8008281904610115
      properties:
        bid:
          description: New cost-per-click bid. Set to 0 to stop delivery.
          format: double
          type: number
        id:
          description: "Seller-campaign identifier in format {sellerId}.{campaignId}"
          type: string
      type: object
    Size:
      description: Size entity containing width and height of the creative
      example:
        width: 1
        height: 6
      nullable: true
      properties:
        height:
          format: int32
          nullable: true
          type: integer
        width:
          format: int32
          nullable: true
          type: integer
      type: object

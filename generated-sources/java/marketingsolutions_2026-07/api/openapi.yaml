    PlacementsReportQueryMessage:
      additionalProperties: false
      description: This is the message defining the query for Placements report
      example:
        disclosed: true
        endDate: 2000-01-23T04:56:07.000+00:00
        timezone: UTC
        format: json
        advertiserIds: advertiserIds
        environment: Web
        adsetIds: adsetIds
        currency: currency
        campaignIds: campaignIds
        metrics:
        - Clicks
        - Clicks
        placement: placement
        startDate: 2000-01-23T04:56:07.000+00:00
        dimensions:
        - AdsetId
        - AdsetId
      properties:
        adsetIds:
          description: "Optional list of ad set IDs to filter on. The ad sets must\
            \ already exist. If empty, all ad sets will be included."
          nullable: true
          type: string
        advertiserIds:
          description: "List of advertiser IDs to report on, provided as a single\
            \ comma-separated string (e.g., \"123,456,789\"). The advertisers must\
            \ already exist. If empty, all advertisers will be used."
          type: string
        campaignIds:
          description: "Optional list of campaign IDs to filter on. The campaigns\
            \ must already exist. If empty, all campaigns will be included."
          nullable: true
          type: string
        currency:
          description: The currency used for the report. ISO 4217 code (three-letter
            capitals).
          type: string
        dimensions:
          description: List of dimensions for the report. At least one dimension should
            be provided.
          items:
            enum:
            - AdsetId
            - AdvertiserId
            - Placement
            - Environment
            - AdsetName
            - AdvertiserName
            - CampaignId
            - CampaignName
            - AdChannel
            - SocialPlatform
            - CategoryId
            - CategoryName
            type: string
          minItems: 1
          type: array
        disclosed:
          default: true
          description: Optionally returns disclosed or undisclosed placements.
          type: boolean
        endDate:
          description: "End date of the report. Date component of ISO 8601 format,\
            \ any time or timezone component is ignored."
          format: date-time
          type: string
        environment:
          description: "Optional type of environment to filter on. If empty, all environments\
            \ will be included."
          enum:
          - Web
          - Android
          - Ios
          nullable: true
          type: string
        format:
          default: json
          description: Optional file format of the generated report.
          enum:
          - csv
          - excel
          - xml
          - json
          type: string
        metrics:
          description: List of metrics for the report. At least one dimension should
            be provided.
          items:
            enum:
            - Clicks
            - Displays
            - Cost
            - SalesPc30d
            - RevenuePc30d
            - CosPc30d
            - RoasPc30d
            - CpoPc30d
            - CvrPc30d
            - SalesPv1d
            - RevenuePv1d
            - CosPv1d
            - RoasPv1d
            - CpoPv1d
            - CvrPv1d
            type: string
          minItems: 1
          type: array
        placement:
          description: "Optional filter on a specific placement domain name. If empty,\
            \ all placements will be included."
          nullable: true
          type: string
        startDate:
          description: "Start date of the report. Date component of ISO 8601 format,\
            \ any time or timezone component is ignored. Must be ≤ endDate."
          format: date-time
          type: string
        timezone:
          default: UTC
          description: Optional timezone used for the report. Timezone Database format
            (Tz).
          nullable: true
          type: string
      required:
      - advertiserIds
      - currency
      - dimensions
      - endDate
      - metrics
      - startDate
      type: object

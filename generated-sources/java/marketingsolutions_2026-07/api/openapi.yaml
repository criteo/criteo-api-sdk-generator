        \ is shown in a banner\r\nB | clicks | Number of clicks on product\r\nC |\
        \ cost | Amount spent for clicks on products\r\nD | saleUnits | Number of\
        \ products sold attributed to clicks\r\nE | revenue | Revenue generated by\
        \ sales\r\nF | CR = Conversion Rate | salesUnits / clicks\r\nG | CPO = Cost\
        \ Per Order | cost / salesUnits\r\nH | COS = Cost of Sale | cost / revenue\r\
        \nI | ROAS = Return On Add Spend | revenue / cost\r\n            \r\nThe last\
        \ six metrics can be computed in two ways depending on the policy to count\
        \ only\r\nthe sales that result from clicks on the same sellers product in\
        \ a banner\r\n(same-seller) or not (any-seller).  Reporting can be controlled\
        \ by `clickAttributionPolicy`.\r\n            \r\nThe 9 (or 15) metric values\
        \ appear in the output as the final 9 (or 15) columns.\r\n            \r\n\

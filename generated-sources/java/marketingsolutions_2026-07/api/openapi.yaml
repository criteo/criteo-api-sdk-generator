    CreateAdSetBudgetV26Q1:
      description: "Budget create model for an ad set.\r\nFor \"capped\": budgetAmount\
        \ (required, non-null), budgetRenewal (required, not \"undefined\"), and budgetDeliverySmoothing\
        \ (required) must all be provided.\r\npacingBehavior is optional; \"targetAverageDailyBudget\"\

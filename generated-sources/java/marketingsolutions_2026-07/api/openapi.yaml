    PatchAdSetBudgetV26Q1:
      description: "Budget patch model for an ad set. Only provided fields are updated;\
        \ omitted fields are left unchanged.\r\nSwitching to \"uncapped\": set budgetStrategy\
        \ to \"uncapped\" and budgetAmount.value to null. Other budget fields (budgetRenewal,\
        \ budgetDeliverySmoothing, budgetDeliveryWeek, and pacingBehavior) are automatically\
        \ cleared.\r\nSwitching to \"capped\": set budgetStrategy to \"capped\", budgetAmount.value\
        \ to a positive number, budgetRenewal to a period, and budgetDeliverySmoothing\
        \ to a pacing strategy.\r\npacingBehavior can only be set for capped budgets\
        \ using standard delivery smoothing; \"targetAverageDailyBudget\" also requires\
        \ monthly renewal.\r\nManual budget updates are not supported when the linked\
        \ marketing campaign has budget automation enabled."
      example:
        budgetDeliverySmoothing: accelerated
        budgetDeliveryWeek: undefined
        budgetAmount:
          value: 0.8008281904610115
        budgetRenewal: undefined
        pacingBehavior: undefined
        budgetStrategy: capped
      properties:
        budgetAmount:
          $ref: '#/components/schemas/NillableDecimal'
        budgetDeliverySmoothing:
          description: "Pacing strategy for spending the budget within a renewal period.\
            \ Only applicable when budgetStrategy is \"capped\".\r\n- \"accelerated\"\
            : spend pacing is based on delivery efficiency rather than the full budget\
            \ period.\r\n- \"standard\": spread spending evenly over the renewal period.\r\
            \nWhen budgetStrategy is \"uncapped\", this field is not set (null in\
            \ read responses, omit in create/patch requests)."
          enum:
          - accelerated
          - standard
          nullable: true
          type: string
        budgetDeliveryWeek:
          description: "Defines which day-of-week boundaries are used for weekly budget\
            \ renewal. Only applicable when budgetStrategy is \"capped\", budgetRenewal\
            \ is \"weekly\", and budgetDeliverySmoothing is \"standard\".\r\n- \"\
            mondayToSunday\", \"tuesdayToMonday\", etc.: the day range over which\
            \ the weekly budget is paced. Changing this value on the active budget\
            \ also propagates to all scheduled budgets of the same ad set.\r\n- \"\
            undefined\": used when budgetStrategy is \"uncapped\", when budgetRenewal\
            \ is not \"weekly\", or when budgetDeliverySmoothing is \"accelerated\"\
            ."
          enum:
          - undefined
          - mondayToSunday
          - tuesdayToMonday
          - wednesdayToTuesday
          - thursdayToWednesday
          - fridayToThursday
          - saturdayToFriday
          - sundayToSaturday
          nullable: true
          type: string
        budgetRenewal:
          description: "The period over which the budget is spent.\r\n- \"daily\"\
            , \"monthly\", \"weekly\": budget resets at the start of each period.\r\
            \n- \"lifetime\": budget covers the entire ad set duration without resetting.\r\
            \n- \"undefined\": only used when budgetStrategy is \"uncapped\" (no renewal\
            \ applies). Required for capped budgets (must not be \"undefined\")."
          enum:
          - undefined
          - daily
          - monthly
          - lifetime
          - weekly
          nullable: true
          type: string
        budgetStrategy:
          description: "Controls whether the ad set has a spending limit.\r\n- \"\
            capped\": spending is limited to budgetAmount. Requires budgetAmount (non-null),\
            \ budgetRenewal (not \"undefined\"), and budgetDeliverySmoothing (not\
            \ null).\r\n- \"uncapped\": no spending limit. budgetAmount is null, budgetRenewal\
            \ is \"undefined\", and budgetDeliverySmoothing is null."
          enum:
          - capped
          - uncapped
          nullable: true
          type: string
        pacingBehavior:
          description: "Controls how a standard capped budget is paced.\r\n- \"targetFullBudget\"\
            : spend toward the full budget amount within the renewal period.\r\n-\
            \ \"targetAverageDailyBudget\": spend toward an average daily amount.\
            \ Only supported for capped, standard, monthly budgets.\r\n- \"undefined\"\
            : no explicit pacing behavior. Required for uncapped budgets and accelerated\
            \ budgets."
          enum:
          - undefined
          - targetFullBudget
          - targetAverageDailyBudget
          nullable: true
          type: string
      type: object

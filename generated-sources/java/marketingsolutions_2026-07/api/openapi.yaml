openapi: 3.0.1
info:
  description: Criteo API - MarketingSolutions
  title: Criteo API
  version: 2026-07
servers:
- url: https://api.criteo.com
security:
- oauth: []
tags:
- name: Advertiser
- name: Analytics
- name: Audience
- name: Campaign
- name: Creative
- name: Gateway
- name: Reco
paths:
  /2026-07/advertisers/me:
    get:
      description: Fetch the portfolio of Advertisers for this account
      operationId: ListAdvertisers
      responses:
        "200":
          content:
            application/json:
              example:
                data:
                - type: advertiser
                  id: "13"
                  attributes:
                    advertiserName: ClientName1
                - type: advertiser
                  id: "1352"
                  attributes:
                    advertiserName: ClientName2
                - type: advertiser
                  id: "73550"
                  attributes:
                    advertiserName: ClientName3
                errors: []
                warnings: []
              schema:
                $ref: '#/components/schemas/GetPortfolioResponse'
          description: Success
      security:
      - oauth: []
      summary: /2026-07/advertisers/me
      tags:
      - Advertiser
      x-accepts: application/json
  /2026-07/log-level/advertisers/{advertiser-id}/report:
    post:
      description: This Statistics endpoint provides publisher data.
      operationId: GetTransparencyReport
      parameters:
      - description: The advertiser ID to fetch the transparency data for. The advertiser
          must already exist. Must be greater than 0.
        explode: false
        in: path
        name: advertiser-id
        required: true
        schema:
          format: int32
          type: string
        style: simple
      requestBody:
        content:
          application/json:
            example:
              shouldDisplayProductIds: false
              startDate: 2024-01-01T00:00:00.0000000+00:00
              endDate: 2024-01-04T00:00:00.0000000+00:00
            schema:
              $ref: '#/components/schemas/TransparencyQueryMessage'
          application/xml:
            example: "<TransparencyQueryMessage xmlns:i=\"http://www.w3.org/2001/XMLSchema-instance\"\
              \ xmlns=\"http://schemas.datacontract.org/2004/07/Criteo.Api.Exam.Statistics.Controllers.V1.Messages\"\
              >\r\n  <EndDate>2024-01-04T00:00:00</EndDate>\r\n  <StartDate>2024-01-01T00:00:00</StartDate>\r\
              \n  <ShouldDisplayProductIds>false</ShouldDisplayProductIds>\r\n</TransparencyQueryMessage>"
            schema:
              $ref: '#/components/schemas/TransparencyQueryMessage'
          text/xml:
            example: "<TransparencyQueryMessage xmlns:i=\"http://www.w3.org/2001/XMLSchema-instance\"\
              \ xmlns=\"http://schemas.datacontract.org/2004/07/Criteo.Api.Exam.Statistics.Controllers.V1.Messages\"\
              >\r\n  <EndDate>2024-01-04T00:00:00</EndDate>\r\n  <StartDate>2024-01-01T00:00:00</StartDate>\r\
              \n  <ShouldDisplayProductIds>false</ShouldDisplayProductIds>\r\n</TransparencyQueryMessage>"
            schema:
              $ref: '#/components/schemas/TransparencyQueryMessage'
          application/*+xml:
            example: "<TransparencyQueryMessage xmlns:i=\"http://www.w3.org/2001/XMLSchema-instance\"\
              \ xmlns=\"http://schemas.datacontract.org/2004/07/Criteo.Api.Exam.Statistics.Controllers.V1.Messages\"\
              >\r\n  <EndDate>2024-01-04T00:00:00</EndDate>\r\n  <StartDate>2024-01-01T00:00:00</StartDate>\r\
              \n  <ShouldDisplayProductIds>false</ShouldDisplayProductIds>\r\n</TransparencyQueryMessage>"
            schema:
              $ref: '#/components/schemas/TransparencyQueryMessage'
        description: The query message.
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TransparencyReportListResponse'
            application/xml:
              schema:
                $ref: '#/components/schemas/TransparencyReportListResponse'
            text/xml:
              schema:
                $ref: '#/components/schemas/TransparencyReportListResponse'
          description: Success
      security:
      - oauth:
        - MarketingSolutions_Analytics_Read
      summary: "/2026-07/log-level/advertisers/{advertiser-id}/report"
      tags:
      - Analytics
      x-content-type: application/json
      x-accepts: application/json
  /2026-07/marketing-solutions/ad-sets:
    patch:
      description: Patch a list of AdSets.
      operationId: PatchAdSets
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RequestsPatchAdSetV26Q1'
        description: List of adsets to patch.
        required: true
        x-bodyName: adSets
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResponsesAdSetIdV26Q1'
          description: Patched attributes for adSets specified in the request.
      security:
      - oauth:
        - MarketingSolutions_Campaign_Manage
      summary: /2026-07/marketing-solutions/ad-sets
      tags:
      - Campaign
      x-content-type: application/json
      x-accepts: application/json
    post:
      description: Create an ad set with the provided parameters
      operationId: CreateAdSet
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateAdSetV26Q1Request'
        description: the ad sets to create
        required: true
        x-bodyName: adSet
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResponseReadAdSetV26Q1'
          description: The ad set that has been created and errors / warnings
      security:
      - oauth:
        - MarketingSolutions_Campaign_Manage
      summary: /2026-07/marketing-solutions/ad-sets
      tags:
      - Campaign
      x-content-type: application/json
      x-accepts: application/json
  /2026-07/marketing-solutions/ad-sets/{ad-set-id}:
    get:
      description: Get the data for the specified ad set
      operationId: GetAdSet
      parameters:
      - description: Id of the ad set
        explode: false
        in: path
        name: ad-set-id
        required: true
        schema:
          type: string
        style: simple
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResponseReadAdSetV26Q1'
          description: data for the ad set
      security:
      - oauth:
        - MarketingSolutions_Campaign_Read
      summary: "/2026-07/marketing-solutions/ad-sets/{ad-set-id}"
      tags:
      - Campaign
      x-accepts: application/json
  /2026-07/marketing-solutions/ad-sets/{ad-set-id}/audience:
    put:
      description: Link or unlink an audience with an ad set
      operationId: UpdateAdSetAudience
      parameters:
      - description: The ad set ID.
        explode: false
        in: path
        name: ad-set-id
        required: true
        schema:
          type: string
        style: simple
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdSetAudienceLinkInputEntityV1'
        description: Ad set-Audience update request.
        required: true
        x-bodyName: request
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdSetAudienceLinkEntityV1Response'
          description: Success
      security:
      - oauth:
        - MarketingSolutions_Campaign_Manage
      summary: "/2026-07/marketing-solutions/ad-sets/{ad-set-id}/audience"
      tags:
      - Campaign
      x-content-type: application/json
      x-accepts: application/json
  /2026-07/marketing-solutions/ad-sets/{ad-set-id}/category-bids:
    get:
      description: Get the Category Bids for all valid Categories associated to an
        Ad Set
      operationId: GetAdSetCategoryBids
      parameters:
      - description: Id of the Ad Set
        explode: false
        in: path
        name: ad-set-id
        required: true
        schema:
          type: string
        style: simple
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdSetCategoryBidListResponse'
          description: List of Category Bids for all valid Categories associated to
            an Ad Set.
      security:
      - oauth:
        - MarketingSolutions_Campaign_Read
      summary: "/2026-07/marketing-solutions/ad-sets/{ad-set-id}/category-bids"
      tags:
      - Campaign
      x-accepts: application/json
    patch:
      description: "Update the Category Bids for given Categories associated to an\
        \ Ad Set\r\nPatch Category Bids for one or more Categories in a single request.\
        \ Partial success policy is followed."
      operationId: PatchAdSetCategoryBids
      parameters:
      - description: Id of the Ad Set
        explode: false
        in: path
        name: ad-set-id
        required: true
        schema:
          type: string
        style: simple
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchAdSetCategoryBidListRequest'
        description: Collection of category bids to update
        required: true
        x-bodyName: categoryBidsToUpdate
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PatchAdSetCategoryBidResultListResponse'
          description: "List of updated Category Bids for given Categories associated\
            \ to an Ad Set, used for partial successes as well."
      security:
      - oauth:
        - MarketingSolutions_Campaign_Manage
      summary: "/2026-07/marketing-solutions/ad-sets/{ad-set-id}/category-bids"
      tags:
      - Campaign
      x-content-type: application/json
      x-accepts: application/json
  /2026-07/marketing-solutions/ad-sets/{ad-set-id}/display-multipliers:
    get:
      description: Get the Display Multipliers for all valid Categories associated
        to an Ad Set
      operationId: GetDisplayMultipliers
      parameters:
      - description: Id of the Ad Set
        explode: false
        in: path
        name: ad-set-id
        required: true
        schema:
          type: string
        style: simple
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdSetDisplayMultiplierListResponse'
          description: List of Display Multipliers for all valid Categories associated
            to an Ad Set.
      security:
      - oauth:
        - MarketingSolutions_Campaign_Read
      summary: "/2026-07/marketing-solutions/ad-sets/{ad-set-id}/display-multipliers"
      tags:
      - Campaign
      x-accepts: application/json
    patch:
      description: "Update the Display Multipliers for given Categories associated\
        \ to an Ad Set\r\nPatch Display Multipliers for one or more Categories in\
        \ a single request. Partial success policy is followed."
      operationId: PatchDisplayMultipliers
      parameters:
      - description: Id of the Ad Set
        explode: false
        in: path
        name: ad-set-id
        required: true
        schema:
          type: string
        style: simple
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchAdSetDisplayMultiplierListRequest'
        description: List of display multiplier values to change
        required: true
        x-bodyName: displayMultipliersToUpdate
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PatchAdSetDisplayMultiplierResultListResponse'
          description: List of updated Display Multipliers for given Categories associated
            to an Ad Set. Make sure to check the error field in the response since
            a partial success will result in a 200 response code.
      security:
      - oauth:
        - MarketingSolutions_Campaign_Manage
      summary: "/2026-07/marketing-solutions/ad-sets/{ad-set-id}/display-multipliers"
      tags:
      - Campaign
      x-content-type: application/json
      x-accepts: application/json
  /2026-07/marketing-solutions/ad-sets/search:
    post:
      description: "Search for ad sets based on provided criteria.\r\nThis returns\
        \ the full configuration of ad sets matching those criteria.\r\nField projection\
        \ can be used if only a subset of fields is required, instead of the full\
        \ configuration.\r\n            \r\nIf specific fields are precised in the\
        \ user prompt, use meta.fields field projection in order to query only the\
        \ value of these fields, else, provide every field."
      operationId: SearchAdSets
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdSetSearchRequestV26Q1'
        x-bodyName: request
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResponsesReadAdSetV26Q1'
          description: data for the ad sets
      security:
      - oauth:
        - MarketingSolutions_Campaign_Read
      summary: /2026-07/marketing-solutions/ad-sets/search
      tags:
      - Campaign
      x-content-type: application/json
      x-accepts: application/json
  /2026-07/marketing-solutions/ad-sets/start:
    post:
      description: Start the specified list of ad sets
      operationId: StartAdSets
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RequestsAdSetId'
        description: All the ad sets to start
        x-bodyName: adSets
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResponsesAdSetId'
          description: List of ad sets that have been started and errors / warnings
            by ad set
      security:
      - oauth:
        - MarketingSolutions_Campaign_Manage
      summary: /2026-07/marketing-solutions/ad-sets/start
      tags:
      - Campaign
      x-content-type: application/json
      x-accepts: application/json
  /2026-07/marketing-solutions/ad-sets/stop:
    post:
      description: Stop the specified list of ad sets
      operationId: StopAdSets
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RequestsAdSetId'
        description: All the ad sets to stop
        x-bodyName: adSets
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResponsesAdSetId'
          description: List of ad sets that have been stopped and errors / warnings
            by ad set
      security:
      - oauth:
        - MarketingSolutions_Campaign_Manage
      summary: /2026-07/marketing-solutions/ad-sets/stop
      tags:
      - Campaign
      x-content-type: application/json
      x-accepts: application/json
  /2026-07/marketing-solutions/ads/{ad-id}/product-boost:
    get:
      description: Fetch all boosting associations and configurations
      operationId: FetchBoostedAdAssociations
      parameters:
      - description: ID of the ad
        explode: false
        in: path
        name: ad-id
        required: true
        schema:
          type: string
        style: simple
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValueResourceCollectionOutcomeOfBoostedAdProductSet'
          description: successful operation
      security:
      - oauth:
        - MarketingSolutions_Reco_Read
      summary: "/2026-07/marketing-solutions/ads/{ad-id}/product-boost"
      tags:
      - Reco
      x-accepts: application/json
  /2026-07/marketing-solutions/ads/{ad-id}/product-boost/{product-set-id}:
    delete:
      description: Delete association and configuration.
      operationId: DeleteBoostedAdAssociation
      parameters:
      - description: ID of the ad
        explode: false
        in: path
        name: ad-id
        required: true
        schema:
          type: string
        style: simple
      - description: ID of the product set
        explode: false
        in: path
        name: product-set-id
        required: true
        schema:
          type: string
        style: simple
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValueResourceOutcomeOfBoostedAdProductSet'
          description: successful operation
      security:
      - oauth:
        - MarketingSolutions_Reco_Manage
      summary: "/2026-07/marketing-solutions/ads/{ad-id}/product-boost/{product-set-id}"
      tags:
      - Reco
      x-accepts: application/json
    get:
      description: Fetch boosting association and configuration
      operationId: FetchBoostedAdAssociation
      parameters:
      - description: ID of the ad
        explode: false
        in: path
        name: ad-id
        required: true
        schema:
          type: string
        style: simple
      - description: ID of the product set
        explode: false
        in: path
        name: product-set-id
        required: true
        schema:
          type: string
        style: simple
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValueResourceOutcomeOfBoostedAdProductSet'
          description: successful operation
      security:
      - oauth:
        - MarketingSolutions_Reco_Read
      summary: "/2026-07/marketing-solutions/ads/{ad-id}/product-boost/{product-set-id}"
      tags:
      - Reco
      x-accepts: application/json
    post:
      description: Create or update product boosting configuration
      operationId: CreateBoostedAdAssociation
      parameters:
      - description: ID of the ad
        explode: false
        in: path
        name: ad-id
        required: true
        schema:
          type: string
        style: simple
      - description: ID of the product set
        explode: false
        in: path
        name: product-set-id
        required: true
        schema:
          type: string
        style: simple
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ValueResourceInputOfBoostingConfigurationRequest'
        x-bodyName: boostedAdProductSetAssociationRequest
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValueResourceOutcomeOfBoostedAdProductSet'
          description: successful operation
        "201":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValueResourceOutcomeOfBoostedAdProductSet'
          description: successful operation
      security:
      - oauth:
        - MarketingSolutions_Reco_Manage
      summary: "/2026-07/marketing-solutions/ads/{ad-id}/product-boost/{product-set-id}"
      tags:
      - Reco
      x-content-type: application/json
      x-accepts: application/json
  /2026-07/marketing-solutions/ads/{ad-id}/product-filter:
    delete:
      description: Disable product filtering for a given ad
      operationId: DisableProductFiltering
      parameters:
      - description: ID of the ad
        explode: false
        in: path
        name: ad-id
        required: true
        schema:
          type: string
        style: simple
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValueResourceOutcomeOfProductFilterConfig'
          description: Successful operation
      security:
      - oauth:
        - MarketingSolutions_Reco_Manage
      summary: "/2026-07/marketing-solutions/ads/{ad-id}/product-filter"
      tags:
      - Reco
      x-accepts: application/json
    get:
      description: Fetch product filtering configuration for a given ad
      operationId: FetchProductFilteringConfig
      parameters:
      - description: ID of the ad
        explode: false
        in: path
        name: ad-id
        required: true
        schema:
          type: string
        style: simple
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValueResourceOutcomeOfProductFilterConfig'
          description: "Successful operation. Returns the product filtering configuration\
            \ if it exists, or empty data if it doesn't."
      security:
      - oauth:
        - MarketingSolutions_Reco_Read
      summary: "/2026-07/marketing-solutions/ads/{ad-id}/product-filter"
      tags:
      - Reco
      x-accepts: application/json
    post:
      description: Enable product filtering for a given ad
      operationId: EnableProductFiltering
      parameters:
      - description: ID of the ad
        explode: false
        in: path
        name: ad-id
        required: true
        schema:
          type: string
        style: simple
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ValueResourceInputOfCreateProductFilterRequest'
        x-bodyName: createProductFilterRequest
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValueResourceOutcomeOfProductFilterConfig'
          description: successful operation
      security:
      - oauth:
        - MarketingSolutions_Reco_Manage
      summary: "/2026-07/marketing-solutions/ads/{ad-id}/product-filter"
      tags:
      - Reco
      x-content-type: application/json
      x-accepts: application/json
  /2026-07/marketing-solutions/ads/{id}:
    delete:
      description: Delete an Ad
      operationId: DeleteAd
      parameters:
      - description: The ad identifier to delete.
        explode: false
        in: path
        name: id
        required: true
        schema:
          format: int32
          type: string
        style: simple
      responses:
        "204":
          description: The ad was deleted.
      security:
      - oauth:
        - MarketingSolutions_Creative_Manage
      summary: "/2026-07/marketing-solutions/ads/{id}"
      tags:
      - Creative
      x-accepts: application/json
    get:
      description: Get an Ad with its id
      operationId: GetAd
      parameters:
      - description: The ad identifier to retrieve.
        explode: false
        in: path
        name: id
        required: true
        schema:
          format: int32
          type: string
        style: simple
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResourceOutcomeOfAd'
          description: The found ad is returned.
      security:
      - oauth:
        - MarketingSolutions_Creative_Read
      summary: "/2026-07/marketing-solutions/ads/{id}"
      tags:
      - Creative
      x-accepts: application/json
  /2026-07/marketing-solutions/advertisers/{advertiser-id}/ads:
    get:
      description: Get the list of self-services Ads for a given advertiser
      operationId: GetAdvertiserAds
      parameters:
      - description: The advertiser identifier.
        explode: false
        in: path
        name: advertiser-id
        required: true
        schema:
          type: string
        style: simple
      - description: The number of ads to be returned. The default is 50.
        explode: true
        in: query
        name: limit
        required: false
        schema:
          format: int32
          nullable: true
          type: integer
        style: form
      - description: The (zero-based) offset into the collection of ads. The default
          is 0.
        explode: true
        in: query
        name: offset
        required: false
        schema:
          format: int32
          nullable: true
          type: integer
        style: form
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResourceCollectionOutcomeOfAd'
          description: The list of self-services Ads is returned.
      security:
      - oauth:
        - MarketingSolutions_Creative_Read
      summary: "/2026-07/marketing-solutions/advertisers/{advertiser-id}/ads"
      tags:
      - Creative
      x-accepts: application/json
    post:
      description: Create an Ad
      operationId: CreateAdvertiserAd
      parameters:
      - description: The advertiser identifier.
        explode: false
        in: path
        name: advertiser-id
        required: true
        schema:
          type: string
        style: simple
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResourceInputOfAdWrite'
        required: true
        x-bodyName: request
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResourceOutcomeOfAd'
          description: The created Ad is returned.
      security:
      - oauth:
        - MarketingSolutions_Creative_Manage
      summary: "/2026-07/marketing-solutions/advertisers/{advertiser-id}/ads"
      tags:
      - Creative
      x-content-type: application/json
      x-accepts: application/json
  /2026-07/marketing-solutions/advertisers/{advertiser-id}/coupons:
    get:
      description: Get the list of self-services Coupons for a given advertiser
      operationId: GetAdvertiserCoupons
      parameters:
      - description: The advertiser identifier.
        explode: false
        in: path
        name: advertiser-id
        required: true
        schema:
          type: string
        style: simple
      - description: The number of coupons to be returned. The default is 50.
        explode: true
        in: query
        name: limit
        required: false
        schema:
          format: int32
          nullable: true
          type: integer
        style: form
      - description: The (zero-based) offset into the collection of coupons. The default
          is 0.
        explode: true
        in: query
        name: offset
        required: false
        schema:
          format: int32
          nullable: true
          type: integer
        style: form
      responses:
        "200":
          content:

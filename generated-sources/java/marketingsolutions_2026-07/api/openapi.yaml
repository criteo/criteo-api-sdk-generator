    PatchMarketingCampaignBudgetAutomation:
      description: "Budget automation, lets users configure budgets once at the campaign\
        \ level while Criteo dynamically routes spend toward the best-performing ad\
        \ sets.\r\nOnly provided fields are updated; omitted fields are left unchanged.\r\
        \nIf \"enabled\" is omitted and only \"budgetConfiguration\" is provided,\
        \ \"enabled\" defaults to false — budget automation will not be activated.\r\
        \nTo activate budget automation, \"enabled\" must be explicitly set to true\
        \ along with a valid \"budgetConfiguration\".\r\nTo deactivate, set \"enabled\"\
        \ to false; \"budgetConfiguration\" can be omitted."
      example:
        budgetConfiguration:
          adSetObjectives: conversions
        enabled: true
      properties:
        budgetConfiguration:
          $ref: '#/components/schemas/BudgetAutomationConfiguration'
        enabled:

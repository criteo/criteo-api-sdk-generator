        \  \"campaignIds\": [\r\n            143962\r\n        ],\r\n        \"budgetType\"\
        : \"Capped\",\r\n        \"amount\": 1000,\r\n        \"startDate\": \"2021-01-11\"\
        ,\r\n        \"endDate\": \"2021-01-12\",\r\n        \"spend\": null,\r\n\
        \        \"status\": \"Active\"\r\n    }\r\n            \r\nA budget limits\
        \ the spend of a seller for one or more campaigns.\r\n            \r\nThere\
        \ are three types of budget:<br /><b>Uncapped</b> budgets put no limit on\
        \ the total amount of spend.<br /><b>Capped</b> budgets limit the total spend\
        \ to a fixed amount.<br /><b>Daily</b> budgets limit daily spend to a fixed\
        \ amount.<br />\r\n            \r\nIn addition, budgets can limit the spend\
        \ to a specific range of dates using\r\nthe start and end date attributes.\
        \ Finally a budget must be active to be used.\r\n            \r\n<b>Spend</b>\

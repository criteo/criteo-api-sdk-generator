openapi: 3.0.1
info:
  description: Criteo API - RetailMedia
  title: Criteo API
  version: 2026-07
servers:
- url: https://api.criteo.com
security:
- oauth: []
tags:
- name: Accounts
- name: Analytics
- name: Audience
- name: Balance
- name: Billing
- name: Campaign
- name: Catalog
- name: Gateway
paths:
  /2026-07/retail-media/account-management/accounts/{accountId}/brands/add:
    post:
      description: Add brands to an account
      operationId: AddBrands
      parameters:
      - description: the account id to update
        explode: false
        in: path
        name: accountId
        required: true
        schema:
          type: string
        style: simple
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ValueResourceInputOfRetailMediaBrands'
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValueResourceOutcomeOfRetailMediaBrands'
          description: Success
      security:
      - oauth:
        - RetailMedia_Accounts_Manage
      summary: "/2026-07/retail-media/account-management/accounts/{accountId}/brands/add"
      tags:
      - Accounts
      x-content-type: application/json
      x-accepts: application/json
  /2026-07/retail-media/account-management/accounts/{accountId}/brands/remove:
    post:
      description: Remove brands from an account
      operationId: RemoveBrands
      parameters:
      - description: the account id to update
        explode: false
        in: path
        name: accountId
        required: true
        schema:
          type: string
        style: simple
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ValueResourceInputOfRetailMediaBrands'
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValueResourceOutcomeOfRetailMediaBrands'
          description: Success
      security:
      - oauth:
        - RetailMedia_Accounts_Manage
      summary: "/2026-07/retail-media/account-management/accounts/{accountId}/brands/remove"
      tags:
      - Accounts
      x-content-type: application/json
      x-accepts: application/json
  /2026-07/retail-media/account-management/accounts/{accountId}/create-brand-account:
    post:
      description: Creates a new child Demand Brand account for the provided parent
        Private Market account
      operationId: CreatePrivateMarketDemandBrandAccount
      parameters:
      - description: The given account id
        explode: false
        in: path
        name: accountId
        required: true
        schema:
          type: string
        style: simple
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ValueResourceInputOfRetailMediaBrandAccountCreation'
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EntityResourceOutcomeOfRetailMediaAccount'
          description: Success
      security:
      - oauth:
        - RetailMedia_Accounts_Manage
      summary: "/2026-07/retail-media/account-management/accounts/{accountId}/create-brand-account"
      tags:
      - Accounts
      x-content-type: application/json
      x-accepts: application/json
  /2026-07/retail-media/account-management/accounts/{accountId}/create-seller-account:
    post:
      description: Creates a new child Demand Seller account for the provided parent
        Private Market account
      operationId: CreatePrivateMarketDemandSellerAccount
      parameters:
      - description: The given account id
        explode: false
        in: path
        name: accountId
        required: true
        schema:
          type: string
        style: simple
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ValueResourceInputOfRetailMediaSellerAccountCreation'
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EntityResourceOutcomeOfRetailMediaAccount'
          description: Success
      security:
      - oauth:
        - RetailMedia_Accounts_Manage
      summary: "/2026-07/retail-media/account-management/accounts/{accountId}/create-seller-account"
      tags:
      - Accounts
      x-content-type: application/json
      x-accepts: application/json
  /2026-07/retail-media/account-management/accounts/{accountId}/private-market-child-accounts:
    get:
      description: Gets Private Market child accounts that are associated with the
        given account
      operationId: GetPrivateMarketChildAccountsByAccountId
      parameters:
      - description: Account Id
        explode: false
        in: path
        name: accountId
        required: true
        schema:
          type: string
        style: simple
      - description: The number of accounts to be returned. The default is 25.
        explode: true
        in: query
        name: limit
        required: false
        schema:
          default: 25
          format: int32
          type: integer
        style: form
      - description: The (zero-based) offset into the collection of accounts. The
          default is 0.
        explode: true
        in: query
        name: offset
        required: false
        schema:
          default: 0
          format: int32
          type: integer
        style: form
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EntityResourceCollectionOutcomeOfRetailMediaChildAccountAndMetadata'
          description: Success
      security:
      - oauth:
        - RetailMedia_Accounts_Read
      summary: "/2026-07/retail-media/account-management/accounts/{accountId}/private-market-child-accounts"
      tags:
      - Accounts
      x-accepts: application/json
  /2026-07/retail-media/account-management/accounts/{accountId}/sellers:
    put:
      description: Replace the sellers associated with an account
      operationId: UpdateSellers
      parameters:
      - description: The given account id
        explode: false
        in: path
        name: accountId
        required: true
        schema:
          type: string
        style: simple
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ValueResourceCollectionInputOfRetailMediaSeller'
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValueResourceCollectionOutcomeOfRetailMediaSeller'
          description: Success
      security:
      - oauth:
        - RetailMedia_Accounts_Manage
      summary: "/2026-07/retail-media/account-management/accounts/{accountId}/sellers"
      tags:
      - Accounts
      x-content-type: application/json
      x-accepts: application/json
  /2026-07/retail-media/accounts:
    get:
      description: Gets page of account objects that the current user can access
      operationId: GetAccounts
      parameters:
      - description: The ids that you would like to limit your result set to
        explode: true
        in: query
        name: limitToId
        required: false
        schema:
          items:
            type: string
          type: array
        style: form
      - description: The 0 indexed page index you would like to receive given the
          page size
        explode: true
        in: query
        name: pageIndex
        required: false
        schema:
          default: 0
          format: int32
          type: integer
        style: form
      - description: The maximum number of items you would like to receive in this
          request
        explode: true
        in: query
        name: pageSize
        required: false
        schema:
          default: 25
          format: int32
          type: integer
        style: form
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JsonApiPageResponseOfAccount'
          description: Success
      security:
      - oauth:
        - RetailMedia_Accounts_Read
      summary: /2026-07/retail-media/accounts
      tags:
      - Accounts
      x-accepts: application/json
  /2026-07/retail-media/accounts/{account-id}/audience-segments:
    patch:
      description: "Updates the properties of all segments with a valid configuration,\
        \ and returns the full segments. For those that cannot be updated, one or\
        \ multiple errors are returned."
      operationId: bulkUpdateAudienceSegments
      parameters:
      - description: Account id
        explode: false
        in: path
        name: account-id
        required: true
        schema:
          type: string
        style: simple
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RmAudienceSegmentBulkUpdateInputV1'
        description: Segment Update request
        required: true
        x-bodyName: request
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RmAudienceSegmentEntityV1ListResponse'
          description: Success or partial success
      security:
      - oauth:
        - RetailMedia_Audience_Manage
      summary: "/2026-07/retail-media/accounts/{account-id}/audience-segments"
      tags:
      - Audience
      x-content-type: application/json
      x-accepts: application/json
  /2026-07/retail-media/accounts/{account-id}/audience-segments/{audience-segment-id}/contact-list:
    get:
      description: Returns the statistics of a contact list segment.
      operationId: getAudienceSegmentContactListStatistics
      parameters:
      - description: Account Id
        explode: false
        in: path
        name: account-id
        required: true
        schema:
          type: string
        style: simple
      - description: Segment Id.
        explode: false
        in: path
        name: audience-segment-id
        required: true
        schema:
          type: string
        style: simple
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RmContactListStatisticsEntityV1Response'
          description: Success or partial success
      security:
      - oauth:
        - RetailMedia_Audience_Read
      summary: "/2026-07/retail-media/accounts/{account-id}/audience-segments/{audience-segment-id}/contact-list"
      tags:
      - Audience
      x-accepts: application/json
  /2026-07/retail-media/accounts/{account-id}/audience-segments/create:
    post:
      description: "Creates all segments with a valid configuration, and returns the\
        \ full segments. For those that cannot be created, one or multiple errors\
        \ are returned."
      operationId: bulkCreateAudienceSegments
      parameters:
      - description: Account Id
        explode: false
        in: path
        name: account-id
        required: true
        schema:
          type: string
        style: simple
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RmAudienceSegmentBulkCreateInputV1'
        description: Segment creation parameter
        required: true
        x-bodyName: request
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RmAudienceSegmentEntityV1ListResponse'
          description: Success or partial success
      security:
      - oauth:
        - RetailMedia_Audience_Manage
      summary: "/2026-07/retail-media/accounts/{account-id}/audience-segments/create"
      tags:
      - Audience
      x-content-type: application/json
      x-accepts: application/json
  /2026-07/retail-media/accounts/{account-id}/audience-segments/delete:
    post:
      description: Delete the segments associated to the given IDs.
      operationId: bulkDeleteAudienceSegments
      parameters:
      - description: Account id
        explode: false
        in: path
        name: account-id
        required: true
        schema:
          type: string
        style: simple
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RmAudienceSegmentBulkDeleteInputV1'
        description: Segment delete request.
        required: true
        x-bodyName: request
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RmAudienceSegmentIdEntityV1ListResponse'
          description: Success or partial success
      security:
      - oauth:
        - RetailMedia_Audience_Manage
      summary: "/2026-07/retail-media/accounts/{account-id}/audience-segments/delete"
      tags:
      - Audience
      x-content-type: application/json
      x-accepts: application/json
  /2026-07/retail-media/accounts/{account-id}/audience-segments/search:
    post:
      description: "Returns a list of segments that match the provided filters. If\
        \ present, the filters are AND'ed together when applied."
      operationId: searchAudienceSegments
      parameters:
      - description: Account Id
        explode: false
        in: path
        name: account-id
        required: true
        schema:
          type: string
        style: simple
      - description: The number of elements to be returned. The default is 50 and
          the maximum is 500.
        explode: true
        in: query
        name: limit
        required: false
        schema:
          default: 50
          format: int32
          maximum: 500
          minimum: 0
          type: integer
        style: form
      - description: The (zero-based) offset into the collection. The default is 0.
        explode: true
        in: query
        name: offset
        required: false
        schema:
          default: 0
          format: int32
          type: integer
        style: form
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RmAudienceSegmentSearchInputV1'
        description: Segment search filters.
        required: true
        x-bodyName: request
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RmAudienceSegmentEntityV1RmAudienceSegmentSearchMetadataV1ListResponse'
          description: Success or partial success
      security:
      - oauth:
        - RetailMedia_Audience_Read
      summary: "/2026-07/retail-media/accounts/{account-id}/audience-segments/search"
      tags:
      - Audience
      x-content-type: application/json
      x-accepts: application/json
  /2026-07/retail-media/accounts/{account-id}/audiences/search:
    post:
      description: "Returns a list of audiences that match the provided filters. If\
        \ present, the filters are AND'ed together when applied."
      operationId: searchAudiences
      parameters:
      - description: Account Id
        explode: false
        in: path
        name: account-id
        required: true
        schema:
          type: string
        style: simple
      - description: The number of elements to be returned. The default is 50 and
          the maximum is 500.
        explode: true
        in: query
        name: limit
        required: false
        schema:
          default: 50
          format: int32
          maximum: 500
          minimum: 0
          type: integer
        style: form
      - description: The (zero-based) offset into the collection. The default is 0.
        explode: true
        in: query
        name: offset
        required: false
        schema:
          default: 0
          format: int32
          type: integer
        style: form
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RmAudienceSearchInputV1'
        description: Audience search filters.
        required: true
        x-bodyName: request
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RmAudienceEntityV1RmAudienceSearchMetadataV1ListResponse'
          description: Success or partial success
      security:
      - oauth:
        - RetailMedia_Audience_Read
      summary: "/2026-07/retail-media/accounts/{account-id}/audiences/search"
      tags:
      - Audience
      x-content-type: application/json
      x-accepts: application/json
  /2026-07/retail-media/accounts/{account-id}/balances:
    post:
      description: Create balance for the given account id
      operationId: CreateBalanceByAccountId
      parameters:
      - description: The account to create balances for
        explode: false
        in: path
        name: account-id
        required: true
        schema:
          type: string
        style: simple
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateBalanceV3Request'
        description: An object that represents the available options to set when creating
          a Retail Media Balance
        required: true
        x-bodyName: createBalance
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BalanceResponseV3Response'
          description: Success
      security:
      - oauth:
        - RetailMedia_Balance_Manage
      summary: "/2026-07/retail-media/accounts/{account-id}/balances"
      tags:
      - Balance
      x-content-type: application/json
      x-accepts: application/json
  /2026-07/retail-media/accounts/{account-id}/balances/{balance-id}:
    get:
      description: Get a balance for the given account id and balance id
      operationId: GetBalanceByAccountAndBalanceId
      parameters:
      - description: The account of the balance
        explode: false
        in: path
        name: account-id
        required: true
        schema:
          type: string
        style: simple
      - description: The balance id
        explode: false
        in: path
        name: balance-id
        required: true
        schema:
          type: string
        style: simple
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BalanceResponseV2Response'
          description: Success
      security:
      - oauth:
        - RetailMedia_Balance_Read
      summary: "/2026-07/retail-media/accounts/{account-id}/balances/{balance-id}"
      tags:
      - Balance
      x-accepts: application/json
    patch:
      description: Modify a balance for the given account id
      operationId: UpdateBalanceV1
      parameters:
      - description: The account of the balance
        explode: false
        in: path
        name: account-id
        required: true
        schema:
          type: string
        style: simple
      - description: The balance to change the dates
        explode: false
        in: path
        name: balance-id
        required: true
        schema:
          type: string
        style: simple
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ValueResourceInputOfUpdateBalanceModelV1'
        description: An object that represents the available options to modify a balance.
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EntityResourceOutcomeOfBalanceResponseV1'
          description: Success
      security:
      - oauth:
        - RetailMedia_Balance_Manage
      summary: "/2026-07/retail-media/accounts/{account-id}/balances/{balance-id}"
      tags:
      - Balance
      x-content-type: application/json
      x-accepts: application/json
  /2026-07/retail-media/accounts/{account-id}/balances/{balance-id}/add-funds:
    post:
      description: Add funds to a balance for the given account id
      operationId: AddFundsByAccountAndBalanceId
      parameters:
      - description: The account of the balance
        explode: false
        in: path
        name: account-id
        required: true
        schema:
          type: string
        style: simple
      - description: The balance to add funds to
        explode: false
        in: path
        name: balance-id
        required: true
        schema:
          type: string
        style: simple
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddFundsToBalanceV3Request'
        description: An object that represents the available options of adding funds
          to a balance.
        required: true
        x-bodyName: addFundsToBalance
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BalanceResponseV3Response'
          description: Success
      security:
      - oauth:
        - RetailMedia_Balance_Manage
      summary: "/2026-07/retail-media/accounts/{account-id}/balances/{balance-id}/add-funds"
      tags:
      - Balance
      x-content-type: application/json
      x-accepts: application/json
  /2026-07/retail-media/accounts/{account-id}/balances/{balance-id}/change-dates:
    post:
      description: Change dates of a balance for the given account id
      operationId: ChangeDatesByAccountAndBalanceId
      parameters:
      - description: The account of the balance
        explode: false
        in: path
        name: account-id
        required: true
        schema:
          type: string
        style: simple
      - description: The balance to change the dates
        explode: false
        in: path
        name: balance-id
        required: true
        schema:
          type: string
        style: simple
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangeDatesOfBalanceV2Request'
        description: An object that represents the available options to modify schedule
          of a balance.
        required: true
        x-bodyName: changeDatesOfBalance
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BalanceResponseV2Response'
          description: Success
      security:
      - oauth:
        - RetailMedia_Balance_Manage
      summary: "/2026-07/retail-media/accounts/{account-id}/balances/{balance-id}/change-dates"
      tags:
      - Balance
      x-content-type: application/json
      x-accepts: application/json
  /2026-07/retail-media/accounts/{account-id}/campaigns:
    get:
      description: Gets page of campaign objects for the given account id
      operationId: GetCampaignsByAccountId
      parameters:
      - description: The given account id
        explode: false
        in: path
        name: account-id
        required: true
        schema:
          type: string
        style: simple
      - description: The ids that you would like to limit your result set to
        explode: true
        in: query
        name: limitToId
        required: false
        schema:
          items:
            type: string
          type: array
        style: form
      - description: The 0 indexed page index you would like to receive given the
          page size
        explode: true
        in: query
        name: pageIndex
        required: false
        schema:
          default: 0
          format: int32
          maximum: 2147483647
          minimum: 0
          type: integer
        style: form
      - description: The maximum number of items you would like to receive in this
          request
        explode: true
        in: query
        name: pageSize
        required: false
        schema:
          default: 25
          format: int32
          maximum: 2147483647
          minimum: 1
          type: integer
        style: form
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JsonApiPageResponseOfCampaignV202301'

# Custom templates for the SDKs generated from api-specifications-test-only/ (generated, but never pushed).
# The test-only specs don't expose the Gateway API used by the tests and samples of the public SDKs, so test-only SDKs get their own list of custom templates.
files:
  custom/ClientCredentialsClient.php.mustache:
    folder : lib
    templateType: SupportingFiles
    destinationFilename: ClientCredentialsClient.php
  custom/OAuthClient.php.mustache:
    folder : lib
    templateType: SupportingFiles
    destinationFilename: OAuthClient.php
  custom/ClientCredentialsClient/Token.php.mustache:
    folder : lib/ClientCredentialsClient
    templateType: SupportingFiles
    destinationFilename: Token.php
  custom/PolymorphismApiTest.php.mustache:
    folder : test/Api
    templateType: SupportingFiles
    destinationFilename: PolymorphismApiTest.php

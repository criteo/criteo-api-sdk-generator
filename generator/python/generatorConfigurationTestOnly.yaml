# Custom templates for the SDKs generated from api-specifications-test-only/ (generated, but never pushed).
# The test-only specs don't expose the Gateway API used by the tests and samples of the public SDKs, so test-only SDKs get their own list of custom templates.
files:
  custom/api_client_builder.py.mustache:
    destinationFilename: api_client_builder.py
    folder : %sdkFolder%
    templateType : SupportingFiles
  custom/criteo_api_client.py.mustache:
    destinationFilename: criteo_api_client.py
    folder : %sdkFolder%
    templateType : SupportingFiles
  custom/criteo_rest.py.mustache:
    destinationFilename: criteo_rest.py
    folder : %sdkFolder%
    templateType : SupportingFiles
  custom/criteo_auth.py.mustache:
    destinationFilename: criteo_auth.py
    folder : %sdkFolder%
    templateType : SupportingFiles
  custom/flow_constants.py.mustache:
    destinationFilename: flow_constants.py
    folder : %sdkFolder%
    templateType : SupportingFiles
  custom/test_polymorphism_api.py.mustache:
    folder : test
    templateType: SupportingFiles
    destinationFilename: test_polymorphism_api.py

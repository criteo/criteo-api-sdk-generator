import org.openapitools.generator.gradle.plugin.tasks.GenerateTask

buildscript {
    repositories {
        mavenLocal()
        maven { url = "https://repo1.maven.org/maven2" }
    }

    dependencies {
        classpath "org.openapitools:openapi-generator-gradle-plugin:6.3.0"
    }
}

apply plugin: 'helper'
apply plugin: 'java-library'
apply plugin: 'org.openapi.generator'

ext {
    jar.enabled = false
}

def clientOutputDir = "$rootDir/$rootProject.generatedClientsDirName/python"
def buildDir = "$projectDir/build"
def criteoPackage = providers.gradleProperty("package.name.base").orNull
def generatorVersion = providers.gradleProperty("generator.version").orNull
def technologyStack = "python"
def nameSeparator = '_'
def language = technologyStack.replaceAll(/[^a-zA-Z]/,"").toLowerCase()

def cleanPreviousDist = registerCleanPreviousDistTask(tasks, clientOutputDir)

def taskList = [cleanPreviousDist];

rootProject.swaggerSourceList.each {
    def parsedApiName = it.getName().replace(".json", "").toLowerCase();
    def taskSuffix = language + "_" + parsedApiName
    def (criteoService, apiVersionFromName) = parsedApiName.tokenize('_');
    def criteoApiVersion = apiVersionFromName.replace('-', '_');

    def clientOutputDirPerVersion = clientOutputDir + "/" + parsedApiName;
    def specPath = it.path;

    def versionInNamespace =  computeVersionInNamespace(criteoApiVersion)

    def namespaceBase = "${criteoPackage}.${criteoService}.${versionInNamespace}".replace('.', nameSeparator).toString(); // example: criteo_api_marketingsolutions_v2021_10

    def artifactVersion = getArtifactVersion(criteoApiVersion, generatorVersion)

    def configDir = "${buildDir}/${parsedApiName}"
    def generatedConfigFile = "${namespaceBase}.yaml"
    def createConfig = registerCreateConfigTask(project, taskSuffix, configDir, generatedConfigFile, namespaceBase)

    def generateTask = registerOpenApiGenerateTask(project, taskSuffix, "python-prior", "${configDir}/${generatedConfigFile}", specPath, clientOutputDirPerVersion, criteoService, [
            apiVersion              : artifactVersion,
            artifactId              : "criteo-api-${criteoService}-sdk",
            description             : "${language.toUpperCase()} SDK for Criteo API ${criteoService} for ${criteoApiVersion} version",
            invokerPackage          : 'Criteo\\SDK',
            packageName             : namespaceBase,
            packageUrl              : "https://github.com/criteo/criteo-api-${language}-sdk",
            packageVersion          : artifactVersion, // v2021_10.1.211109
            projectName             : "criteo-api-${criteoService}-sdk",
    ]
    )
    generateTask.configure {
        dependsOn createConfig
    }

    def copyLicense = registerCopyLicenseTask(project, technologyStack, parsedApiName, clientOutputDirPerVersion)

    def removeUnwantedFiles = registerRemoveUnwantedFilesTasks(project, technologyStack, parsedApiName, clientOutputDirPerVersion,
            ['.openapi-generator-ignore', '.travis.yml', 'git_push.sh']
    )

    taskList << generateTask.name
    taskList << copyLicense.name
    taskList << createConfig.name
    taskList << removeUnwantedFiles.name
}


tasks.register("generateClient") {
    group = 'Criteo'
    description = "Generate the ${language.toUpperCase()} client using openapi-generator and custom templates".toString()
    dependsOn(taskList)
}
